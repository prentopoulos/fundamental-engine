[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-engine"
version = "0.1.0"
description = "Explainable macroeconomic research: current evidence and calendar expectations."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md", "NOTICE.md"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "anthropic>=1.2,<2",
    "defusedxml>=0.7.1,<1",
    "pydantic>=2.6,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8,<10", "ruff>=0.4,<1", "httpx>=0.27,<1", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/prentopoulos/fundamental-engine"
Issues = "https://github.com/prentopoulos/fundamental-engine/issues"

[project.scripts]
fundamental-engine = "engine.__main__:main"
fundamental-engine-demo = "engine.demo:main"
fundamental-engine-web = "engine.web.app:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["prompts/*.md", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
